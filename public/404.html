<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>سَفرة | جاري التحويل...</title>
    <script>
      // Graceful fallback for GitHub Pages
      (function() {
        var pathSegments = window.location.pathname.split('/').filter(Boolean);
        var isGitHubPages = window.location.hostname.endsWith('github.io') && pathSegments.length > 0;
        var basePath = isGitHubPages ? '/' + pathSegments[0] + '/' : '/';
        window.location.replace(basePath);
      })();
    </script>
  </head>
  <body style="background-color: #FFF9F0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p style="color: #651F2B; font-weight: bold;">جاري نقلك إلى سَفرة...</p>
  </body>
</html>
